services:
  jarvis-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    env_file:
      - .env.local
    restart: unless-stopped

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    ports:
      - "9000:9000"
    volumes:
      - whisper_models:/root/.cache/whisper
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=openai_whisper
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  piper-tts:
    image: rhasspy/wyoming-piper:latest
    ports:
      - "5000:5000"
    command: --model en_US-lessac-medium.onnx
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      jarvis-agent:
        condition: service_started
    env_file:
      - .env.local
    restart: unless-stopped

volumes:
  whisper_models:
