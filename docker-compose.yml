services:
  livekit-server:
    image: livekit/livekit-server:v1.8.2
    ports:
      - "7880:7880"
      - "7881:7881"
    command: --dev --bind 0.0.0.0 --redis-port 6379
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7880"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.5.7
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  jarvis-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    depends_on:
      livekit-server:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - .env.local
    restart: unless-stopped

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    ports:
      - "9000:9000"
    volumes:
      - whisper_models:/root/.cache/whisper
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=openai_whisper
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  piper-tts:
    image: rhasspy/wyoming-piper:latest
    ports:
      - "5000:5000"
    command: --model en_US-lessac-medium.onnx
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      livekit-server:
        condition: service_healthy
      jarvis-agent:
        condition: service_started
    env_file:
      - .env.local
    restart: unless-stopped

volumes:
  ollama_data:
  whisper_models:
