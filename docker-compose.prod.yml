version: '3.8'

services:
  livekit-server:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  ollama:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G

  jarvis-agent:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  whisper:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  piper-tts:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  nextjs:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    environment:
      - NODE_ENV=production
