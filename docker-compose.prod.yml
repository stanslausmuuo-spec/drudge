version: '3.8'

services:
  jarvis-agent:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  whisper:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  piper-tts:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  nextjs:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    environment:
      - NODE_ENV=production
